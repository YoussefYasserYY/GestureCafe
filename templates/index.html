<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Cafe</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* General body styling */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080'); /* Cafe-themed background */
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

        /* Title styling */
        h1 {
            font-size: 3rem;
            color: #f8f9fa;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Processed video styling */
        img {
            border: 4px solid #ffc107;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            margin: 20px;
            max-width: 90vw;
            max-height: 60vh;
        }

        /* Message box styling */
        #message {
            font-size: 1.5rem;
            color: #212529;
            background-color: #ffc107;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            margin-top: 20px;
            text-align: center;
            width: 80%;
            max-width: 600px;
        }

        /* Footer styling */
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #f8f9fa;
            text-align: center;
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Gesture Cafe</h1>
    <img id="processed-video" alt="Processed Video Stream" />
    <div id="message">Start ordering by showing your hand</div>

    <footer>
        <p>Created by <strong>Youssef Yasser</strong></p>
        <p>Licensed under the <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>.</p>
    </footer>

    <script>
        const processedVideoElement = document.getElementById('processed-video');
        const messageElement = document.getElementById('message');
        const socket = io('http://localhost:5000'); // Connect to backend

        // Access user's webcam but don't show video
        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                const videoTrack = stream.getVideoTracks()[0];
                const imageCapture = new ImageCapture(videoTrack);

                // Send frames to backend every 100ms
                setInterval(async () => {
                    const bitmap = await imageCapture.grabFrame();
                    const canvas = document.createElement('canvas');
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob((blob) => {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64data = reader.result.split(',')[1];
                            socket.emit('send_frame', base64data);
                        };
                        reader.readAsDataURL(blob);
                    });
                }, 100);
            })
            .catch((error) => {
                console.error('Webcam access error:', error);
            });

        // Display only processed frames
        socket.on('receive_frame', (data) => {
            processedVideoElement.src = `data:image/jpeg;base64,${data}`;
        });

        // Receive messages from the backend
        socket.on('update_message', (message) => {
            messageElement.textContent = message; // Update the message
            console.log('message', message);
        });

        socket.on('connect', () => {
            console.log('Connected to server.');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server.');
        });
    </script>
</body>

</html>
